<div id="page-orders" class="page-section hidden">
  <div class="topbar">
    <div class="flex gap-8">
      <button class="menu-toggle" onclick="toggleMobileSidebar()">☰</button>
      <h1>Orders</h1>
    </div>
    <button class="btn btn-primary" onclick="navigateTo('createorder')">+ New Order</button>
  </div>

  <div class="card">
    <div class="filters-bar">
      <input type="text" class="form-control" id="orderSearchInput" placeholder="Search by ID, customer, phone or product..." oninput="debouncedOrderSearch()" />
      <select class="form-control" id="orderStatusFilter" onchange="load_orders()">
        <option value="All">All Statuses</option>
        <option value="Pending">Pending</option>
        <option value="Processing">Processing</option>
        <option value="Dispatched">Dispatched</option>
        <option value="Completed">Completed</option>
        <option value="Cancelled">Cancelled</option>
      </select>
    </div>
    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr><th>Order ID</th><th>Customer</th><th>Product</th><th>Status</th><th>Order Date</th><th>Amount</th><th>Actions</th></tr>
        </thead>
        <tbody id="ordersTableBody">
          <tr><td colspan="7" class="empty-state">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
  let _orderSearchTimer = null;
  function debouncedOrderSearch() {
    clearTimeout(_orderSearchTimer);
    _orderSearchTimer = setTimeout(load_orders, 350);
  }

  async function load_orders() {
    const body = document.getElementById('ordersTableBody');
    body.innerHTML = '<tr><td colspan="7" class="empty-state">Loading...</td></tr>';
    const search = document.getElementById('orderSearchInput').value.trim();
    const status = document.getElementById('orderStatusFilter').value;

    try {
      const res = await callServer('getOrders', APP.token, { search, status });
      if (!res.success) { showToast(res.message, 'error'); return; }
      const orders = res.data;
      if (!orders.length) {
        body.innerHTML = '<tr><td colspan="7" class="empty-state">No orders found.</td></tr>';
        return;
      }
      body.innerHTML = orders.map(o => `
        <tr>
          <td><strong>${escapeHtml(o.OrderID)}</strong></td>
          <td>${escapeHtml(o.CustomerName)}</td>
          <td>${escapeHtml(o.Product)}</td>
          <td><span class="badge badge-${o.Status}">${escapeHtml(o.Status)}</span></td>
          <td>${escapeHtml(o.OrderDate)}</td>
          <td>${o.Amount ? escapeHtml(String(o.Amount)) : '-'}</td>
          <td>
            <div class="flex gap-8">
              <button class="btn btn-sm btn-outline" onclick="navigateTo('editorder', {orderId: '${o.OrderID}'})">Edit</button>
              <button class="btn btn-sm btn-danger" onclick="handleDeleteOrder('${o.OrderID}')">Delete</button>
            </div>
          </td>
        </tr>
      `).join('');
    } catch (err) {
      showToast('Failed to load orders.', 'error');
    }
  }

  async function handleDeleteOrder(orderId) {
    if (!confirm(`Delete order ${orderId}? This cannot be undone.`)) return;
    showLoading();
    try {
      const res = await callServer('deleteOrder', APP.token, orderId);
      hideLoading();
      if (res.success) { showToast('Order deleted.', 'success'); load_orders(); load_dashboard && load_dashboard(); }
      else showToast(res.message, 'error');
    } catch (err) { hideLoading(); showToast('Delete failed.', 'error'); }
  }
</script>
